<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#0a2723"/>
      <stop offset="55%" stop-color="#040e0c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#bffff5"/>
      <stop offset="100%" stop-color="#35f4e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="124" fill="url(#bg)"/>

  <g stroke="#35f4e0" fill="none" filter="url(#glow)">
    <circle cx="128" cy="128" r="96" stroke-width="3" opacity="0.55" stroke-dasharray="4 10"/>
    <circle cx="128" cy="128" r="78" stroke-width="4" opacity="0.85"/>
    <circle cx="128" cy="128" r="60" stroke-width="2" opacity="0.4"/>
  </g>

  <g stroke="#8ffff2" stroke-width="3" opacity="0.8" filter="url(#glow)">
    <line x1="128" y1="20" x2="128" y2="40"/>
    <line x1="128" y1="216" x2="128" y2="236"/>
    <line x1="20" y1="128" x2="40" y2="128"/>
    <line x1="216" y1="128" x2="236" y2="128"/>
  </g>

  <g stroke="#8ffff2" stroke-width="1.4" fill="none" opacity="0.75">
    <ellipse cx="128" cy="128" rx="46" ry="17"/>
    <ellipse cx="128" cy="128" rx="46" ry="17" transform="rotate(60 128 128)"/>
    <ellipse cx="128" cy="128" rx="46" ry="17" transform="rotate(120 128 128)"/>
  </g>

  <circle cx="128" cy="128" r="46" fill="url(#core)"/>
  <circle cx="128" cy="128" r="10" fill="#ffffff" filter="url(#glow)"/>
</svg>
