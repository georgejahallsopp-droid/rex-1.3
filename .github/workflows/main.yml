name: Build JARVIS Windows exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build JARVIS.exe
        run: npm run dist

      - name: Upload JARVIS.exe
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-exe
          path: dist/*.exe
          if-no-files-found: error
